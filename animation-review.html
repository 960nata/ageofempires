<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Crown · Pratinjau animasi</title><style>
*{box-sizing:border-box}body{margin:0;background:#141d19;color:#ece3cb;font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{font:32px Georgia;margin:8px 0}p{color:#bfc9bf;max-width:950px;line-height:1.6}label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#d7c89f}nav{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}select,button{padding:10px;background:#2a372c;color:#f0e4c7;border:1px solid #6e7556;border-radius:5px}button{align-self:flex-end;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#243128;border:1px solid #4c5946;border-radius:8px;overflow:hidden}.card h2{font:17px Georgia;padding:14px 18px;margin:0}.card small{display:block;color:#c1c7b7;padding:0 18px 16px}canvas{width:100%;display:block;background:radial-gradient(ellipse at 50% 90%,#405140,#26342b 70%)}.marine canvas{background:radial-gradient(ellipse at 50% 90%,#2b7082,#133e57 75%)}a{color:#e8d296}#status{color:#d1bb77;font-size:13px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}
</style><main><a href="/">← Kembali ke game</a><h1>Gerakan & titik pijak</h1><p>Pratinjau memakai pengendali animasi yang sama dengan game. Pilih delapan arah dan kegiatan kapal untuk memeriksa frame satu per satu.</p><nav><label>Peradaban<select id="faction"></select></label><label>Gerakan pasukan<select id="motion"><option value="walk">Jalan</option><option value="run">Lari berkuda</option><option value="attack">Menyerang</option><option value="idle">Diam</option></select></label><label>Pekerja<select id="job"><option value="walk">Jalan</option><option value="chop">Menebang</option><option value="mine">Menambang</option><option value="farm">Bertani</option><option value="orchard">Memetik buah</option><option value="build">Membangun</option></select></label><label>Era kapal<select id="naval-era"><option value="0">Dark Age</option><option value="1">Feudal Age</option><option value="2">Castle Age</option><option value="3">Imperial Age</option></select></label><label>Kapal<select id="marine-action"><option value="row">Mendayung</option><option value="fish">Menjaring ikan</option><option value="hunt">Menarik tangkapan besar</option><option value="attack">Awak menyerang</option><option value="idle">Diam</option></select></label><label>Arah<select id="direction"><option value="0">Kanan</option><option value="1">Kanan bawah</option><option value="2">Bawah</option><option value="3">Kiri bawah</option><option value="4">Kiri</option><option value="5">Kiri atas</option><option value="6">Atas</option><option value="7">Kanan atas</option></select></label><label>Kecepatan pratinjau<select id="rate"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="pause">Jeda</button><button id="step">+ 1 frame awak</button></nav><div id="status" role="status">Memuat aset…</div><div class="cards" id="cards"></div></main><script type="module" src="/src/rts/animation-review.ts"></script></html>
